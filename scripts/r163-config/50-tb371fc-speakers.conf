# TB371FC internal speakers: MultiMedia1 FE (hw:0,0) -> PRIMARY_TDM_RX_0 -> 4x TFA9894.
# Plain stereo sink; the DSP/ADM maps it onto the 4-slot TDM backend.
context.objects = [
    { factory = adapter
        flags = [ nofail ]
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "tb371fc-speakers"
            node.description = "Динамики планшета"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:0,0"
            audio.format     = "S16LE"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            priority.driver  = 2000
            priority.session = 2000
        }
    }
]
