# TB371FC: the speaker sink is created by pipewire.conf.d/50-tb371fc-speakers.conf on hw:0,0;
# keep the ACP card device from grabbing the same PCM.
monitor.alsa.rules = [
    { matches = [ { device.name = "alsa_card.platform-sound" } ]
      actions = { update-props = { device.disabled = true } } }
]
